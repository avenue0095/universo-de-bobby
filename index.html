<script>
/* ===== Aulas passo a passo — English Galaxy (explicado em pt-BR) ===== */
const EN=(en,pt,fala)=>'<button type="button" class="cartao-en" data-ler="'+encodeURIComponent(en)+'" data-lang="en-US" aria-label="Ouvir '+en+' em inglês">'+
  '<b>'+en+'</b><span class="pt">'+pt+'</span><span class="fala">'+(typeof IC!=='undefined'&&IC.falar?IC.falar:'&#9834;')+' '+fala+'</span></button>';
const ENS=(...c)=>'<div class="tira-en">'+c.join('')+'</div>';

AULAS['e1.1']=[
 P('Duas palavras para "oi"','Em inglês americano existem duas formas de cumprimentar: <b>hello</b> e <b>hi</b>. As duas querem dizer "oi", mas <b>hi</b> é mais solto, entre amigos, e <b>hello</b> é um pouquinho mais formal.',ENS(EN('hello','olá','rélou'),EN('hi','oi','rái'))),
 P('Como se fala','<ol class="passos"><li><b>hello</b> = "ré-lou". O H em inglês tem som de um R bem leve, quase um sopro.</li><li><b>hi</b> = "rái". Rima com "pai".</li></ol>'),
 P('Usando de verdade','Ao encontrar alguém: <b>Hi!</b> Ao atender o telefone, os americanos dizem <b>Hello?</b> Ao se despedir: <b>Bye!</b> (fala-se "bái").'),
 P('Pra não esquecer','Comece toda conversa com hi ou hello. São as duas primeiras palavras que qualquer pessoa aprende em inglês.')
];
AULAS['e1.2']=[
 P('Cumprimentos do dia','O inglês muda o cumprimento conforme a hora: <b>good morning</b> de manhã, <b>good afternoon</b> à tarde, <b>good evening</b> no começo da noite e <b>good night</b> só na hora de dormir.',ENS(EN('good morning','bom dia','gud mórnin'),EN('good night','boa noite','gud náit'))),
 P('A pegadinha do good night','<ol class="passos"><li><b>good evening</b> = boa noite ao <b>chegar</b>.</li><li><b>good night</b> = boa noite ao <b>ir embora</b> ou dormir.</li><li>Chegar numa festa dizendo "good night" soa como "tchau"!</li></ol>'),
 P('Good = bom','Repare que todos começam com <b>good</b>, que quer dizer "bom". Uma palavra só, quatro cumprimentos. Isso é economia de memória.'),
 P('Pra não esquecer','good morning (manhã), good afternoon (tarde), good evening (chegando à noite), good night (indo dormir).')
];
AULAS['e1.3']=[
 P('As palavras mágicas','<b>Please</b> quer dizer "por favor" e <b>thank you</b> quer dizer "obrigado". Nos Estados Unidos elas são usadas o tempo todo, até em coisas pequenas.',ENS(EN('please','por favor','plíz'),EN('thank you','obrigado','tênk iú'))),
 P('Respondendo','<ol class="passos"><li>Alguém diz <b>thank you</b>.</li><li>Você responde <b>you\'re welcome</b> ("iór uélcam") = de nada.</li><li>Entre amigos, também vale <b>sure</b> ou <b>no problem</b>.</li></ol>'),
 P('Thanks é a versão curta','<b>Thanks</b> ("tênks") é o mesmo que thank you, só que mais informal — como o nosso "valeu".'),
 P('Pra não esquecer','Please antes do pedido, thank you depois de receber. Com essas duas, você já é educado em inglês.')
];
AULAS['e1.4']=[
 P('Dizendo seu nome','A frase é <b>My name is...</b> ("mái neim iz") = "Meu nome é...". Depois é só falar seu nome.',ENS(EN('my name is','meu nome é','mái neim iz'),EN('what\'s your name?','qual é seu nome?','uóts iór neim'))),
 P('Uma conversa completa','<ol class="passos"><li>— <b>Hi! What\'s your name?</b> (Oi! Qual é o seu nome?)</li><li>— <b>My name is Lívia. And you?</b> (Meu nome é Lívia. E você?)</li><li>— <b>My name is Bobby. Nice to meet you!</b> (Meu nome é Bobby. Prazer em conhecer você!)</li></ol>'),
 P('O jeito curto','No dia a dia, americanos dizem só <b>I\'m Bobby</b> ("áim Bobby") = "eu sou o Bobby". Mais rápido e igualmente correto.'),
 P('Pra não esquecer','My name is + seu nome. Essa é a frase que abre qualquer apresentação.')
];
AULAS['e1.5']=[
 P('Os primeiros números','one, two, three, four, five — 1 a 5. Repare que a escrita não parece nada com o som; em inglês isso é comum.',ENS(EN('one','um','uân'),EN('two','dois','tchú'),EN('three','três','thrí'))),
 P('Como falar cada um','<ol class="passos"><li><b>one</b> = "uân"</li><li><b>two</b> = "tchú" (o W é mudo)</li><li><b>three</b> = "thrí" — a língua vai entre os dentes</li><li><b>four</b> = "fór", <b>five</b> = "fáiv"</li></ol>'),
 P('Até dez','six ("siks"), seven ("sévan"), eight ("eit" — o GH é mudo), nine ("náin"), ten ("tén").'),
 P('Pra não esquecer','Conte de 1 a 10 em inglês todo dia, apontando os dedos. Em uma semana sai automático.')
];

AULAS['e2.1']=[
 P('As primeiras cores','<b>red</b> (vermelho), <b>blue</b> (azul), <b>green</b> (verde). São três cores que aparecem em tudo: semáforo, bandeira, roupa.',ENS(EN('red','vermelho','réd'),EN('blue','azul','blú'),EN('green','verde','grín'))),
 P('Usando numa frase','<ol class="passos"><li>Estrutura: <b>The + coisa + is + cor</b>.</li><li>The ball is red. = A bola é vermelha.</li><li>The sky is blue. = O céu é azul.</li></ol>'),
 P('A cor vem antes','Diferente do português, em inglês a cor vem <b>antes</b> do objeto: "a red ball" (uma bola vermelha), nunca "a ball red".'),
 P('Pra não esquecer','Olhe ao seu redor e diga a cor de três objetos em inglês. Aprender cor é aprender vendo.')
];
AULAS['e2.2']=[
 P('Mais três cores','<b>yellow</b> (amarelo), <b>black</b> (preto), <b>white</b> (branco).',ENS(EN('yellow','amarelo','iélou'),EN('black','preto','blék'),EN('white','branco','uáit'))),
 P('Cuidado com a pronúncia','<ol class="passos"><li><b>yellow</b> tem dois L e termina em "ou": ié-lou.</li><li><b>white</b> tem o WH que soa "u": uáit.</li><li><b>black</b> tem um A curto, entre o nosso A e E.</li></ol>'),
 P('Perguntando a cor','<b>What color is it?</b> ("uót cálor iz it") = Que cor é? Responda: <b>It\'s yellow.</b> = É amarelo.'),
 P('Pra não esquecer','Nos EUA escreve-se <b>color</b>; na Inglaterra, colour. Aqui aprendemos o americano: color.')
];
AULAS['e2.3']=[
 P('Cores misturadas','<b>orange</b> (laranja), <b>purple</b> (roxo), <b>pink</b> (rosa).',ENS(EN('orange','laranja','órinj'),EN('purple','roxo','pârpol'),EN('pink','rosa','pink'))),
 P('Orange é fruta e cor','<ol class="passos"><li>An <b>orange</b> = uma laranja (a fruta).</li><li>The shirt is <b>orange</b> = a camisa é laranja (a cor).</li><li>Igual ao português: a mesma palavra serve para as duas coisas.</li></ol>'),
 P('Palavras parecidas','Repare que <b>pink</b> e <b>orange</b> parecem palavras que você já conhece do português. Muitas palavras do inglês vieram das mesmas raízes — isso vai te ajudar bastante.'),
 P('Pra não esquecer','Agora você já sabe nove cores. Dá para descrever quase qualquer coisa que você vê.')
];
AULAS['e2.4']=[
 P('Material escolar','<b>book</b> (livro), <b>pencil</b> (lápis), <b>pen</b> (caneta), <b>paper</b> (papel).',ENS(EN('book','livro','buk'),EN('pencil','lápis','pênsol'))),
 P('Um ou vários','<ol class="passos"><li>Um: <b>a book</b> (um livro), <b>a pencil</b> (um lápis).</li><li>Vários: acrescente S — <b>books</b> (livros), <b>pencils</b> (lápis).</li><li>Igualzinho ao português nesse ponto.</li></ol>'),
 P('A ou an?','Usa-se <b>a</b> antes de som de consoante (<b>a book</b> = um livro) e <b>an</b> antes de som de vogal (<b>an apple</b> = uma maçã, <b>an orange</b> = uma laranja). É só para a palavra soar melhor.'),
 P('Pra não esquecer','Junte com as cores: <b>a red pencil</b> = um lápis vermelho. Cor primeiro, coisa depois.')
];
AULAS['e2.5']=[
 P('Na escola','<b>school</b> (escola), <b>teacher</b> (professor/professora), <b>student</b> (aluno), <b>friend</b> (amigo).',ENS(EN('school','escola','skúl'),EN('teacher','professor(a)','tíchâr'))),
 P('Teacher vem de teach','<ol class="passos"><li><b>teach</b> = ensinar.</li><li>Acrescente <b>-er</b> e vira quem faz: <b>teacher</b> = quem ensina, o professor.</li><li>O mesmo truque: <b>play</b> (brincar) → <b>player</b> (jogador), <b>sing</b> (cantar) → <b>singer</b> (cantor), <b>work</b> (trabalhar) → <b>worker</b> (trabalhador).</li></ol>'),
 P('Não tem masculino e feminino','Em inglês, <b>teacher</b> serve para professor e professora. A língua quase não marca gênero — isso facilita muito a sua vida.'),
 P('Pra não esquecer','O sufixo <b>-er</b> transforma ação em pessoa. Guardando esse truque, você entende dezenas de palavras novas sozinho.')
];

AULAS['e3.1']=[
 P('Mãe e pai','<b>mother</b> (mãe) e <b>father</b> (pai). No dia a dia, os americanos usam mais <b>mom</b> e <b>dad</b> — como nosso "mãe" e "pai" carinhoso.',ENS(EN('mother','mãe','mâdâr'),EN('father','pai','fádâr'))),
 P('O som do TH','<ol class="passos"><li>Em <b>mother</b> e <b>father</b>, o TH é falado com a língua entre os dentes.</li><li>Não é T nem D nem F: é um som que o português não tem.</li><li>Comece falando "mâ-DÂR" — já fica compreensível.</li></ol>'),
 P('Dizendo de quem é','Use <b>my</b> = meu/minha: <b>my mother</b>, <b>my father</b>. Não muda se é homem ou mulher, sempre "my".'),
 P('Pra não esquecer','mother/father para escrever, mom/dad para conversar.')
];
AULAS['e3.2']=[
 P('Irmãos','<b>sister</b> (irmã) e <b>brother</b> (irmão).',ENS(EN('sister','irmã','sistâr'),EN('brother','irmão','brâdâr'))),
 P('Falando da família','<ol class="passos"><li>I have a sister. = Eu tenho uma irmã.</li><li>I have two brothers. = Eu tenho dois irmãos.</li><li><b>I have</b> ("ái rév") = eu tenho.</li></ol>'),
 P('Uma palavra bônus','<b>sibling</b> quer dizer irmão ou irmã, sem dizer qual. O português não tem uma palavra assim.'),
 P('Pra não esquecer','I have + número + pessoa. Com essa fórmula você conta sua família inteira.')
];

/* distratores: completa com palavras do mesmo mundo, nunca repetindo a certa */
const _norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim();
/* duas opções "colam" se uma é a mesma coisa que a outra (oi x oi / olá) — nunca podem aparecer juntas */
function _colide(a,b){
  const x=_norm(a),y=_norm(b);
  if(!x||!y)return true;
  if(x===y)return true;
  const px=x.split(/ +/),py=y.split(/ +/);
  return px.some(p=>p.length>1&&py.indexOf(p)>=0);
}
function _outrasEN(id,alvo,campo){
  const m=+id.slice(1).split('.')[0];
  const certa=campo==='en'?alvo.en:alvo.pt;
  const par=campo==='en'?alvo.pt:alvo.en;
  const daFase=(LEX[id]||[]).map(w=>({en:w[0],pt:w[1]}));
  const doMundo=(VOC[m]||[]).map(x=>({en:x[0],pt:x[1]}));
  const vistos={};const res=[];
  shuf(daFase).concat(shuf(doMundo)).forEach(w=>{
    if(res.length>=3)return;
    const v=campo==='en'?w.en:w.pt;
    const outroLado=campo==='en'?w.pt:w.en;
    if(_colide(v,certa))return;              /* mesma palavra ou sinônimo da certa */
    if(_colide(outroLado,par))return;        /* traduz para a mesma coisa que a certa */
    if(res.some(r=>_colide(r,v)))return;     /* dois distratores iguais entre si */
    if(vistos[v])return;
    vistos[v]=1;res.push(v);
  });
  return res;
}
/* palavras iguais nas duas línguas (banana, chocolate): perguntar o significado não ensina nada */
const _igual=w=>_norm(w.en)===_norm(w.pt);
/* progressão de uma fase: apresentar → reconhecer → ouvir → produzir → frase → escrever */
function enMakers(id){
  const L=(LEX[id]||[]).map(w=>({en:w[0],pt:w[1],fala:w[2],frase:w[3],frasePt:w[4]}));
  if(!L.length)return null;
  /* O cursor era compartilhado pelos 6 makers e andava de 1 em 1. Com 3 palavras por fase,
     6 chamadas fechavam a volta exata e a 2ª rodada repetia palavra por palavra —
     genQuestions descartava tudo como duplicado e a fase saía com 6 perguntas em vez de 8.
     Reembaralhar a cada volta quebra esse alinhamento e ainda varia a fase a cada jogada. */
  let ordem=shuf(L),k=0;
  const gira=()=>{const w=ordem[k%ordem.length];k++;if(k%ordem.length===0){ordem=shuf(L);k=0;}return w;};
  return [
   /* 1. apresentação: a resposta está escrita no enunciado — aqui a criança aprende, não adivinha */
   ()=>{const w=gira();
     const ex=w.frase&&w.frasePt?'<span class="trad">Exemplo: '+w.frase+' = '+w.frasePt+'</span>':'';
     return mc('Em inglês, <b>'+w.pt+'</b> se diz <b>'+w.en+'</b> — fala-se “'+w.fala+'”.'+ex+'<br>Agora toque em <b>'+w.pt+'</b> escrito em inglês:',
       w.en,_outrasEN(id,w,'en'),{ouvir:w.en,lang:'en-US',dica:'A resposta está escrita no enunciado: <b>'+w.en+'</b>.'});},
   /* 2. reconhecer: vê o inglês, escolhe o significado */
   ()=>{let w=gira(),n=0;
     while(_igual(w)&&n++<L.length)w=gira();
     if(_igual(w)){
       const falas=L.filter(x=>x.fala&&x.fala!==w.fala).map(x=>x.fala);
       if(falas.length>=2)return mc('<b>'+w.en+'</b> se escreve igual em português! Toque no som certo em inglês:',
         w.fala,shuf(falas).slice(0,3),{ouvir:w.en,lang:'en-US',dica:'Aperte o som e escute com atenção.'});
       const o=L.filter(x=>!_igual(x))[0]||w;
       return mc('O que significa <b>'+o.en+'</b>?',o.pt,_outrasEN(id,o,'pt'),{ouvir:o.en,lang:'en-US'});
     }
     return mc('O que significa <b>'+w.en+'</b>?',w.pt,_outrasEN(id,w,'pt'),
       {ouvir:w.en,lang:'en-US',dica:'Fala-se “'+w.fala+'”. Lembra da aula?'});},
   /* 3. ouvir */
   ()=>{const w=gira();
     return ouvirEN('Ouça e escolha a palavra que você ouviu.',w.en,_outrasEN(id,w,'en'));},
   /* 4. produzir: do português para o inglês */
   ()=>{const w=gira();
     return mc('Como se diz <b>'+w.pt+'</b> em inglês?',w.en,_outrasEN(id,w,'en'),
       {ouvir:w.en,lang:'en-US',dica:'Começa com <b>'+w.en.charAt(0).toUpperCase()+'</b> e fala-se “'+w.fala+'”.'});},
   /* 5. dentro de uma frase de verdade — sempre com a tradução do lado */
   ()=>{const w=gira();
     if(!w.frase)return mc('Qual é a tradução de <b>'+w.pt+'</b>?',w.en,_outrasEN(id,w,'en'),{ouvir:w.en,lang:'en-US'});
     const trad=w.frasePt?'<span class="trad">Em português: '+w.frasePt+'</span>':'';
     const buraco=w.frase.replace(new RegExp(w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'____');
     if(buraco===w.frase)return mc('Nesta frase, o que quer dizer <b>'+w.en+'</b>?<br><b class="fr">'+w.frase+'</b>'+trad,
       w.pt,_outrasEN(id,w,'pt'),{ouvir:w.frase,lang:'en-US'});
     return mc('Complete a frase:<br><b class="fr">'+buraco+'</b>'+trad,w.en,_outrasEN(id,w,'en'),
       {ouvir:w.frase,lang:'en-US',dica:'A tradução está logo abaixo da frase: procure a palavra que quer dizer “'+w.pt+'”.'});},
   /* 6. escrever (só palavras curtas de uma palavra só) */
   ()=>{const curtas=L.filter(w=>w.en.length<8&&w.en.indexOf(' ')<0&&!_igual(w));
     if(!curtas.length){const w=gira();
       return mc('Qual destas é <b>“'+w.pt+'”</b> em inglês?',w.en,_outrasEN(id,w,'en'),
         {ouvir:w.en,lang:'en-US',dica:'Fala-se “'+w.fala+'”.'});}
     const w=curtas[(k++)%curtas.length];
     return txtQ('Escreva em inglês: <b>'+w.pt+'</b>',w.en,{teclado:'letra',dica:'Tem '+w.en.length+' letras e começa com <b>'+w.en.charAt(0).toUpperCase()+'</b>.'});}
  ];
}

/* --- aplica a progressão didática em todas as 50 fases de inglês ---
   ordem: apresentar → reconhecer → ouvir → (prática da fase) → produzir → frase → escrever */
(function(){
  if(typeof UNITS_EN==='undefined')return;
  UNITS_EN.forEach(u=>u.lessons.forEach(l=>{
    const g=enMakers(l.id);
    if(!g)return;
    const extra=l.custom||[];
    l.makers=g.slice(0,3).concat(extra,g.slice(3));
    l.ordem=true;
  }));
})();

/* alimenta o índice de pronúncia/significado usado quando não há voz em inglês */
(function(){
  if(typeof FALA_EN==='undefined')return;
  Object.keys(LEX).forEach(id=>LEX[id].forEach(w=>{
    const k=String(w[0]).toLowerCase();
    if(w[2]&&!FALA_EN[k])FALA_EN[k]=w[2];
    if(w[1]&&!SIG_EN[k])SIG_EN[k]=w[1];
  }));
  if(typeof VOC!=='undefined')Object.keys(VOC).forEach(m=>VOC[m].forEach(x=>{
    const k=String(x[0]).toLowerCase();
    if(x[1]&&!SIG_EN[k])SIG_EN[k]=x[1];
  }));
  if(typeof FRASES!=='undefined')FRASES.forEach(f=>{
    const k=String(f[0]).toLowerCase();
    if(f[1]&&!SIG_EN[k])SIG_EN[k]=f[1];
  });
})();

const CHAVE2='mundo-numeros-v2';

const VERSAO_DADOS=3;
/* IMPORTANTE: cada perfil precisa do SEU proprio objeto.
   Um objeto "vazio" compartilhado faria o progresso de um jogador vazar para o outro,
   porque {feitas:{}} seria a MESMA caixinha para todo mundo. Por isso e uma funcao. */
function estadoVazio(){
  return {nome:'',xp:0,ganhoTotal:0,ofensiva:0,melhorOfensiva:0,ultimoDia:'',
    feitas:{},errados:{},comprado:[],look:{},
    stats:{porLicao:{},dias:{},tempo:0},
    acertos:0,combo:0,som:true,voz:true,nivel:'facil',materia:'mat',
    vozPt:'',vozEn:'',velocidade:1};
}
function clonar(o){
  try{return JSON.parse(JSON.stringify(o));}catch(e){return null;}
}
/* monta um estado valido a partir do que estava guardado, sem nunca reaproveitar objetos */
function estadoDe(dados){
  const s=estadoVazio();
  const d=(dados&&typeof dados==='object')?clonar(dados):null;
  if(d)Object.keys(s).forEach(k=>{if(d[k]!==undefined&&d[k]!==null)s[k]=d[k];});
  const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  s.feitas=obj(s.feitas);s.errados=obj(s.errados);s.look=obj(s.look);
  s.stats=obj(s.stats);
  s.stats.porLicao=obj(s.stats.porLicao);
  s.stats.dias=obj(s.stats.dias);
  s.stats.tempo=+s.stats.tempo||0;
  s.comprado=Array.isArray(s.comprado)?s.comprado.slice():[];
  ['xp','ganhoTotal','ofensiva','melhorOfensiva','acertos','combo'].forEach(k=>{s[k]=+s[k]||0;});
  s.som=s.som!==false;s.voz=s.voz!==false;
  s.vozPt=String(s.vozPt||'').slice(0,80);
  s.vozEn=String(s.vozEn||'').slice(0,80);
  s.velocidade=Math.min(1.3,Math.max(.6,+s.velocidade||1));
  if(['facil','medio','forte'].indexOf(s.nivel)<0)s.nivel='facil';
  if(['mat','pt','en'].indexOf(s.materia)<0)s.materia='mat';
  s.nome=String(s.nome||'').slice(0,18);
  return s;
}
let STORE={v:VERSAO_DADOS,perfis:[],atual:-1,senha:null};
let S=estadoVazio();
/* deixa o armazenamento sempre num formato valido, mesmo se vier corrompido */
function arrumarStore(x){
  const st={v:VERSAO_DADOS,perfis:[],atual:-1,senha:null};
  if(!x||typeof x!=='object')return st;
  const lista=Array.isArray(x.perfis)?x.perfis:[];
  lista.forEach((p,i)=>{
    if(!p||typeof p!=='object')return;
    st.perfis.push({
      id:String(p.id||('p'+Date.now().toString(36)+i.toString(36))),
      nome:String(p.nome||('Jogador '+(i+1))).slice(0,18),
      cor:CORES.indexOf(p.cor)>=0?p.cor:CORES[i%CORES.length],
      criado:+p.criado||Date.now(),
      dados:estadoDe(p.dados)
    });
  });
  if(x.senha&&typeof x.senha==='object'&&x.senha.h&&x.senha.s)
    st.senha={s:String(x.senha.s),h:String(x.senha.h)};
  const a=+x.atual;
  st.atual=(a>=0&&a<st.perfis.length)?a:-1;
  return st;
}
function lerStore(){
  try{
    const raw=localStorage.getItem(CHAVE2);
    if(raw){STORE=arrumarStore(JSON.parse(raw));return;}
  }catch(e){}
  try{
    const antigo=localStorage.getItem(CHAVE);
    if(antigo){
      const d=estadoDe(JSON.parse(antigo));
      STORE=arrumarStore({perfis:[{nome:d.nome||'Jogador 1',cor:CORES[0],dados:d}],atual:0});
      salvarStore();return;

let AC=null;
function nota(f,t,dur,vol){
  if(!S.som)return;
  try{

    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    const t0=AC.currentTime+t;

    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.start(t0);o.stop(t0+dur+.02);
  }catch(e){}
}

/* --- vozes: escolher uma voz de verdade do idioma pedido --- */
let VOZES=[];
function carregarVozes(){
  try{VOZES=speechSynthesis.getVoices()||[];}catch(e){VOZES=[];}
}
if(typeof speechSynthesis!=='undefined'){
  carregarVozes();
  try{speechSynthesis.addEventListener('voiceschanged',carregarVozes);}catch(e){speechSynthesis.onvoiceschanged=carregarVozes;}
  setTimeout(carregarVozes,300);setTimeout(carregarVozes,1200);
}
const idioma=v=>String((v&&v.lang)||'').toLowerCase().replace('_','-');
/* vozes de brincadeira do macOS/iOS: nunca servem para ler uma aula */
const VOZ_RUIM=/albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|jester|junior|organ|superstar|trinoids|whisper|wobble|zarvox|ralph|fred|kathy|princess|hysterical|pipe organ|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|novelty/i;
/* lista de vozes de um idioma, da melhor para a pior */
function vozesDe(lang){
  if(!VOZES.length)carregarVozes();
  const alvo=(lang||'pt-BR').toLowerCase(),raiz=alvo.slice(0,2);
  let c=VOZES.filter(v=>idioma(v)===alvo);
  if(!c.length)c=VOZES.filter(v=>idioma(v).slice(0,2)===raiz);
  const nota=v=>{
    let p=0;const n=(v.name||'').toLowerCase();
    if(VOZ_RUIM.test(n))p-=40;                         /* voz de piada, fora */
    if(v.localService)p+=4;                            /* funciona sem internet */
    if(idioma(v)===alvo)p+=6;                          /* sotaque certo */
    if(/premium|enhanced|neural|natural|siri/.test(n))p+=8;  /* as boas de verdade */
    if(/samantha|ava|allison|luciana|joana|google|zira|aria|jenny|francisca/.test(n))p+=4;
    if(/compact/.test(n))p-=3;
    if(v.default)p+=1;
    return p;
  };
  return c.slice().sort((a,b)=>nota(b)-nota(a));
}
function vozDe(lang){
  const lista=vozesDe(lang);
  if(!lista.length)return null;
  /* respeita a voz escolhida nas configurações, se ela existir neste aparelho */
  const escolhida=(lang==='en-US')?S.vozEn:S.vozPt;
  if(escolhida){
    const achou=lista.filter(v=>v.name===escolhida)[0]||
                VOZES.filter(v=>v.name===escolhida)[0];
    if(achou)return achou;
  }
  return lista[0];
}
function temVoz(lang){return !!vozDe(lang);}
function falar(html,lang){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const ing=lang==='en-US';
    const u=new SpeechSynthesisUtterance(ing?limpaEN(html):emTexto(html));
    u.lang=ing?'en-US':'pt-BR';
    const escolhida=ing?S.vozEn:S.vozPt;
    /* Português: sem escolha, deixa o aparelho usar a voz padrão dele —
       é o som que a criança já conhecia. Inglês é diferente: se ninguém
       escolher, o aparelho leria com a voz portuguesa e sairia errado,
       então aí sim procuramos uma voz inglesa de verdade. */
    let v=null;
    if(escolhida)v=VOZES.filter(x=>x.name===escolhida)[0]||null;
    if(!v&&ing)v=vozDe('en-US');
    if(ing&&!v){if(VOZES.length)avisoVoz();return;}
    if(v)u.voice=v;
    const vel=+S.velocidade||1;
    u.rate=(ing?.82:.92)*vel;u.pitch=1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* O nome do perfil é digitado pela criança e entra em innerHTML em vários lugares.
   Sem escapar, um nome como <img src=x onerror=...> vira código — e o nome viaja
   junto no backup .json, então um arquivo restaurado também carregaria o problema. */
function escapa(t){return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function estrelasSVG(n,total){let h='';for(let i=0;i<(total||3);i++)h+=IC.estrela.replace('<svg',i<n?'<svg class="on"':'<svg');return h;}

function normaliza(t){
  return String(t).toLowerCase().replace(/r\$/g,'').replace(/\s|&nbsp;/g,'')
    .replace(/cm²|cm2|cm³|cm3|cm|graus|°|reais|km|kg|ml|litros?|m\b/g,'').replace(',','.').trim();
}
const semAcento=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9,]/g,'');
function acertou(dado,gab){
  const a=normaliza(dado),b=normaliza(gab);
  if(a===b)return true;
  const na=parseFloat(a),nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb))return Math.abs(na-nb)<1e-9;
  return semAcento(dado)===semAcento(gab);
}

function atualizaBlocos(){

function mdMuda(k,dl){
  if(LIC.conferido)return;
  const m=LIC.qs[LIC.i].max||{c:9,d:9,u:9};
  const md=LIC.md;
  if(dl<0){md[k]=Math.max(0,md[k]-1);nota(420,0,.06,.05);}
  else{
    if(md[k]<9){md[k]++;nota(720,0,.06,.05);}
    else if(k==='u'&&m.d>0){md.u=0;md.d=Math.min(9,md.d+1);trocaAviso('10 unidades viraram 1 dezena!');}
    else if(k==='d'&&m.c>0){md.d=0;md.c=Math.min(9,md.c+1);trocaAviso('10 dezenas viraram 1 centena!');}
  }
  atualizaBlocos();
}

const pick2=a=>a[Math.floor(Math.random()*a.length)];
/* a regrinha principal da fase, tirada da própria aula */
function lembreteDaAula(l){
  const ps=passosDe(l);
  if(!ps||!ps.length)return '';
  /* o último passo é sempre o "Pra não esquecer" */
  let p=ps[ps.length-1];
  if(!p||!p.c)p=ps[0];
  let t=String(p.c).replace(/<ol[\s\S]*?<\/ol>/g,' ').replace(/<[^>]+>/g,m=>/^<\/?b>$/.test(m)?m:' ');
  t=t.replace(/\s+/g,' ').trim();
  if(t.length<12)return '';
  if(t.length>210)t=t.slice(0,207).replace(/\s\S*$/,'')+'...';
  return t;
}
function dicaDaPergunta(q){
  if(q.type==='blocos'){
    const n=+q.answer,c=Math.floor(n/100),d=Math.floor((n%100)/10),u=n%10;
    const pt=[];if(c)pt.push('<b>'+c+'</b> placa'+(c>1?'s':''));if(d)pt.push('<b>'+d+'</b> barrinha'+(d>1?'s':''));
    if(u)pt.push('<b>'+u+'</b> cubinho'+(u>1?'s':''));
    return 'Para montar o <b>'+n+'</b> você precisa de '+pt.join(', ')+'. Toque no <b>+</b> de cada coluna essa quantidade de vezes e olhe o número lá embaixo.';
  }
  if(q.type==='fracao')return 'Toque em <b>'+q.answer+'</b> partes da barra, contando em voz alta: 1, 2, 3...';
  if(q.type==='grupinhos')return 'Coloque <b>'+q.alvoG+'</b> em “grupos” e <b>'+q.alvoP+'</b> em “em cada”. O total aparece sozinho.';
  if(q.type==='dinheiro')return 'Comece pelas notas maiores e vá completando com as moedas até o visor chegar no valor pedido.';
  if(q.type==='silabas')return 'Fale a palavra devagar batendo palma. Cada palma é uma sílaba — toque nelas na ordem.';
  const ps=passosDe(LIC.l);
  return (ps[1]&&ps[1].c)||(ps[0]&&ps[0].c)||'Leia a pergunta de novo devagar.';
}
function mostrarDica(){
  /* No modo fácil a dica é agendada com 700ms de atraso depois de um erro.
     Se a criança tocar em "Continuar" (ou fechar a fase) nesse meio tempo,
     LIC.i já avançou e LIC.qs[LIC.i] vem undefined — dava TypeError e a dica sumia.
     Agora só mostra se ainda houver pergunta na tela. */
  if(LIC.etapa!=='questao')return;
  const q=LIC.qs[LIC.i];
  const cx=$('#caixa-dica');
  if(!q||!cx)return;
  const txt=dicaDaPergunta(q);
  cx.innerHTML='<div class="mini-tuco">'+MASC('pensa')+'</div><div><span class="tit">Como fazer</span>'+txt+
    '<button class="mais-ajuda" id="mais-ajuda">Ainda não entendi</button></div>';
  cx.hidden=false;LIC.dica=1;
  $('#dica').style.display='none';
  falar(txt);
  const ma=$('#mais-ajuda');if(ma)ma.addEventListener('click',ajudaForte);
  $('.lc-corpo').scrollTo(0,$('.lc-corpo').scrollHeight);
}

/* ---------- caderno de erros e revisão do mundo ---------- */
function chaveQ(q){return q.prompt+'||'+q.answer;}
function guardarErrado(q){
  const n=MATERIA+LIC.u.n;const lista=S.errados[n]||[];
  const k=chaveQ(q);
  if(!lista.some(x=>chaveQ(x)===k)){
    const c={type:q.type,prompt:q.prompt,answer:q.answer};
    if(q.options)c.options=q.options.slice();
    if(q.figure)c.figure=q.figure;
    lista.push(c);
  }
  S.errados[n]=lista.slice(-30);salvar();
}
function tirarErrado(q){
  const n=MATERIA+LIC.u.n;const lista=S.errados[n]||[];
  const k=chaveQ(q);
  S.errados[n]=lista.filter(x=>chaveQ(x)!==k);salvar();
}
function abrirRevisaoMundo(ui){
  const u=UNITS[ui];
  let qs=(S.errados[MATERIA+u.n]||[]).slice().sort(()=>Math.random()-.5).slice(0,10);
  const faltam=Math.max(0,6-qs.length);
  for(let k=0;k<faltam;k++){
    const l=u.lessons[Math.floor(Math.random()*u.lessons.length)];
    const nova=genQuestions(l,1)[0];
    if(nova)qs.push(nova);
  }
  const falso={id:'rev'+MATERIA+u.n,glyph:'★',title:'Revisão do Mundo '+u.n,teach:{
    ideia:'Esta é a revisão do Mundo '+u.n+'. Aqui voltam justamente as perguntas que você errou nas fases, para ver se agora ficou claro.',
    exemplo:'Se travar em alguma, volte na fase daquele assunto e leia a aula de novo — ela continua lá, sempre aberta.',
    dica:'Cada pergunta que você acertar aqui sai do seu caderno de erros. Acertando todas, o caderno fica limpo!'}};
  LIC={ui:ui,li:-1,u:u,l:falso,qs:qs,base:qs.length,i:0,passo:0,vidas:5,erros:0,acertos:0,
       combo:0,melhorCombo:0,etapa:'aula',resp:null,digitado:'',conferido:false,dica:false,rev:true,
       md:{c:0,d:0,u:0},miss:{t:'Revisão do Mundo '+u.n,abre:'',fim:'Revisão concluída!'},
       cap:(CAP_ATUAL?CAP_ATUAL[u.n]:null)};

/* instrucao de instalacao conforme o aparelho */
function instrucaoInstalar(){
  const ua=navigator.userAgent||'';
  const iOS=/iPad|iPhone|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const android=/Android/.test(ua);
  if(iOS)return 'No iPhone ou iPad: abra este endereço no <b>Safari</b>, toque no botão de '+
    '<b>compartilhar</b> (o quadradinho com a seta para cima) e escolha '+
    '<b>“Adicionar à Tela de Início”</b>.';
  if(android)return 'No Android: abra este endereço no <b>Chrome</b>, toque nos <b>três pontinhos</b> '+
    'do canto e escolha <b>“Adicionar à tela inicial”</b> ou <b>“Instalar app”</b>.';
  return 'No celular, abra este endereço no navegador e procure a opção '+
    '<b>“Adicionar à tela inicial”</b> — no iPhone fica no botão de compartilhar do Safari, '+
    'no Android fica nos três pontinhos do Chrome.';
}


/* ---------- voz e som ---------- */
function telaVoz(){
  const pt=vozesDe('pt-BR'),en=vozesDe('en-US');
  const REGIAO={'pt-br':'português do Brasil','pt-pt':'português de Portugal',
    'en-us':'inglês americano','en-gb':'inglês britânico','en-au':'inglês australiano',
    'en-ie':'inglês irlandês','en-za':'inglês sul-africano','en-in':'inglês indiano'};
  const nomeCurto=v=>{
    /* nomes vêm como "Eddy (Português (Brasil))" — corta tudo do primeiro parêntese */
    const i=String(v.name||'').indexOf('(');
    return (i>0?String(v.name).slice(0,i):String(v.name||'')).trim()||'Voz sem nome';
  };
  const detalhe=v=>{
    const e=[];
    const reg=REGIAO[idioma(v)];
    if(reg)e.push(reg);
    if(/premium|enhanced|neural|natural/i.test(v.name))e.push('melhor qualidade');
    if(!v.localService)e.push('precisa de internet');
    return e.join(' · ')||idioma(v);
  };
  const lista=(vs,atual,campo)=>{
    if(!vs.length)return '<p class="galeria-intro">Este aparelho não tem nenhuma voz instalada para este idioma.</p>';
    let h='<div class="vozes">';
    h+='<button class="voz-op'+(!atual?' on':'')+'" data-voz="'+campo+'|">'+
       '<b>Voz padrão do aparelho</b><span>a mesma de sempre</span></button>';
    /* quando dois nomes iguais aparecem, o detalhe do lado desempata */
    const vistos={};vs.forEach(v=>{const n=nomeCurto(v);vistos[n]=(vistos[n]||0)+1;});
    vs.forEach(v=>{
      const sel=atual===v.name,n=nomeCurto(v);
      h+='<button class="voz-op'+(sel?' on':'')+'" data-voz="'+campo+'|'+
         String(v.name).replace(/"/g,'&quot;')+'"><b>'+n+'</b>'+
         '<span>'+detalhe(v)+'</span></button>';
    });
    return h+'</div>';
  };

  let h='<div class="perfil-in">';
  h+='<p class="galeria-intro">A voz que lê as aulas vem do próprio aparelho — cada celular tem as suas. '+
     'Toque numa opção para ouvir e ela já fica escolhida.</p>';

  h+='<h2 class="sec">Voz do português</h2>'+lista(pt,S.vozPt,'pt');
  h+='<h2 class="sec">Voz do inglês</h2>';
  if(!en.length)h+='<p class="galeria-intro">Nenhuma voz em inglês instalada. '+
     'No iPhone: <b>Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Inglês</b>. '+
     'No Android: <b>Config. → Idiomas → Conversão de texto em voz</b>.</p>';
  h+=lista(en,S.vozEn,'en');

  const v=Math.round((+S.velocidade||1)*100);
  h+='<h2 class="sec">Velocidade da fala</h2>';
  h+='<div class="velocidade"><input type="range" id="vel" min="60" max="130" step="5" value="'+v+'">'+
     '<div class="vel-tx"><span>mais devagar</span><b id="vel-n">'+v+'%</b><span>mais rápido</span></div>'+
     '<button class="btn fantasma" id="vel-teste">Ouvir uma frase</button></div>';

  h+='<div class="perfil-bts"><button class="btn fantasma" id="volta-voz">Voltar ao perfil</button></div></div>';

  $('#perfil').innerHTML='<div class="rev-topo"><button class="icobtn" id="volta-voz2" aria-label="Voltar">'+
    IC.volta+'</button><h2>Voz e som</h2></div><div class="rev-corpo">'+h+'</div>';
  $('#perfil').classList.add('on');document.body.style.overflow='hidden';
  $('#volta-voz').addEventListener('click',telaPerfil);
  $('#volta-voz2').addEventListener('click',telaPerfil);

  $('#perfil').querySelectorAll('[data-voz]').forEach(b=>b.addEventListener('click',()=>{
    const i=b.dataset.voz.indexOf('|');
    const campo=b.dataset.voz.slice(0,i),nome=b.dataset.voz.slice(i+1);
    if(campo==='pt'){S.vozPt=nome;salvar();falar('Oi! Eu sou o Bobby. Vamos aprender juntos?');}
    else{S.vozEn=nome;salvar();falar('Hello! My name is Bobby. Nice to meet you!','en-US');}
    telaVoz();
  }));
  const r=$('#vel');
  if(r){
    r.addEventListener('input',()=>{$('#vel-n').textContent=r.value+'%';});
    r.addEventListener('change',()=>{S.velocidade=(+r.value)/100;salvar();
      falar('Assim está bom para você acompanhar?');});
  }
  const t=$('#vel-teste');
  if(t)t.addEventListener('click',()=>falar('Contar é apontar para cada coisa e falar um número em voz alta.'));
}

/* ---------- segurança e dados do perfil ---------- */
/* A senha guarda a AREA DO RESPONSAVEL (relatorios, apagar perfis, backup).
   Nao e criptografia de verdade — e uma tranca simples para a crianca nao entrar
   sozinha. Nenhum dado sai deste aparelho. */
function temSenha(){return !!(STORE.senha&&STORE.senha.h);}
function embaralha(pin){
  /* hash simples e estavel; guardamos so o resultado, nunca a senha em si */
  const sal=STORE.senha&&STORE.senha.s?STORE.senha.s:('s'+Math.random().toString(36).slice(2,10));
  let h=5381;const t=sal+'|'+String(pin);
  for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;
  for(let v=0;v<5000;v++)h=((h<<5)+h+(v%97))>>>0;
  return {s:sal,h:h.toString(36)};
}
function definirSenha(pin){STORE.senha=null;STORE.senha=embaralha(pin);salvarStore();}
function conferirSenha(pin){
  if(!temSenha())return true;
  const sal=STORE.senha.s;
  let h=5381;const t=sal+'|'+String(pin);
  for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;
  for(let v=0;v<5000;v++)h=((h<<5)+h+(v%97))>>>0;
  return h.toString(36)===STORE.senha.h;
}
let liberadoAte=0;
const respLiberado=()=>!temSenha()||Date.now()<liberadoAte;
function pedirSenha(titulo,texto,aoAcertar,criando){
  let erro='';
  const pinta=()=>{
    $('#modal').innerHTML='<div class="modal-in senha-in">'+
      '<h2>'+titulo+'</h2><p class="perfis-sub">'+texto+'</p>'+
      '<input id="campo-pin" class="campo pin" type="password" inputmode="numeric" '+
      'autocomplete="off" maxlength="6" placeholder="••••" aria-label="Senha de 4 números">'+
      (erro?'<p class="erro-pin">'+erro+'</p>':'')+
      '<div class="modal-bts"><button class="link" id="pin-cancela">Cancelar</button>'+
      '<button class="btn" id="pin-ok">'+(criando?'Criar senha':'Entrar')+'</button></div></div>';
    $('#modal').classList.add('on');
    const campo=$('#campo-pin');campo.focus();
    const tenta=()=>{
      const v=(campo.value||'').trim();
      if(criando){
        if(!/^[0-9]{4,6}$/.test(v)){erro='Use de 4 a 6 números.';pinta();return;}
        definirSenha(v);liberadoAte=Date.now()+15*60000;
        $('#modal').classList.remove('on');aoAcertar();return;
      }
      if(conferirSenha(v)){liberadoAte=Date.now()+15*60000;$('#modal').classList.remove('on');aoAcertar();}
      else{erro='Senha errada. Tente de novo.';pinta();}
    };
    $('#pin-ok').addEventListener('click',tenta);
    campo.addEventListener('keydown',e=>{if(e.key==='Enter')tenta();});
    $('#pin-cancela').addEventListener('click',()=>{$('#modal').classList.remove('on');});
  };
  pinta();
}
function comSenha(fn){
  if(respLiberado()){fn();return;}
  pedirSenha('Área do responsável','Digite a senha para ver os relatórios e mexer nos perfis.',fn,false);
}
/* backup: leva o perfil inteiro para outro aparelho */
function baixarPerfil(){
  const p=STORE.perfis[STORE.atual];
  if(!p)return;
  const pacote={app:'universo-de-bobby',versao:VERSAO_DADOS,quando:new Date().toISOString(),
    perfil:{nome:p.nome,cor:p.cor,dados:estadoDe(p.dados)}};
  const nome='bobby-'+String(p.nome||'perfil').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.json';
  entregar(nome,JSON.stringify(pacote,null,1));
}
function restaurarPerfil(){
  const ent=document.createElement('input');
  ent.type='file';ent.accept='application/json,.json';
  ent.addEventListener('change',()=>{
    const f=ent.files&&ent.files[0];if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{
      let pac=null;
      try{pac=JSON.parse(fr.result);}catch(e){}
      if(!pac||pac.app!=='universo-de-bobby'||!pac.perfil){
        alertaResp('Esse arquivo não é um backup do Universo de Bobby.');return;
      }
      const d=estadoDe(pac.perfil.dados);
      const nome=String(pac.perfil.nome||'Jogador').slice(0,18);
      STORE.perfis.push({id:'p'+Date.now().toString(36),nome:nome,
        cor:CORES.indexOf(pac.perfil.cor)>=0?pac.perfil.cor:CORES[STORE.perfis.length%CORES.length],
        criado:Date.now(),dados:d});
      salvarStore();
      alertaResp('Perfil <b>'+nome+'</b> restaurado. Ele aparece na tela "Quem vai jogar?".');
    };
    fr.readAsText(f);
  });
  ent.click();
}
function alertaResp(msg){
  const cx=$('#resp-aviso');
  if(cx){cx.innerHTML='<div class="aviso-ok">'+msg+'</div>';return;}
  const d=document.createElement('div');d.className='aviso-voz';
  d.innerHTML='<span>'+msg+'</span>';document.body.appendChild(d);
  setTimeout(()=>{d.classList.add('sai');setTimeout(()=>d.remove(),400);},5200);
}

  if(LIC.conferido)return;

  nota(dl>0?720:420,0,.06,.05);atualizaGrupinhos();

function atualizaGrupinhos(){
  const g=LIC.gr.g||0,p=LIC.gr.p||0;
  let cx='';for(let i=0;i<g;i++){cx+='<span class="caixinha">';
    for(let k=0;k<p;k++)cx+='<i></i>';cx+='</span>';}
  const c1=$('#g-caixas');if(c1)c1.innerHTML=cx||'<span class="vazio">?</span>';
  const c2=$('#g-cada');if(c2){let o='';for(let k=0;k<p;k++)o+='<i class="bolinha"></i>';c2.innerHTML=o||'<span class="vazio">?</span>';}
  const tot=g*p;
  const vn=$('#gr-n');if(vn)vn.textContent=tot;

/* ---------- baixar desenhos ---------- */
function avisoBaixa(t){const a=$('#aviso-baixa');if(a)a.innerHTML=t?'<div class="aviso">'+t+'</div>':'';}
function svgCompleto(svg){return svg.replace('<svg ','<svg width="600" height="900" ');}
function svgParaPng(svg){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');cv.width=1000;cv.height=1500;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,1000,1500);
      cx.drawImage(img,0,0,1000,1500);
      try{res(cv.toDataURL('image/png'));}catch(e){rej(e);}
    };
    img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgCompleto(svg));
  });
}
async function baixarDesenhos(lista,bt){
  const txt=bt?bt.innerHTML:'';
  if(bt){bt.disabled=true;bt.innerHTML='preparando...';}
  avisoBaixa('');
  try{
    const gx=({mat:'matematica',pt:'portugues',en:'ingles'})[MATERIA]||'matematica';
    const nome=lista.length===1
      ?'desenho-'+gx+'-mundo'+UNITS[lista[0][0]].n+'-fase'+(lista[0][1]+1)+'.pdf'
      :'caderno-'+gx+'.pdf';
    const jsPDFok=window.jspdf&&window.jspdf.jsPDF;
    if(jsPDFok){
      const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
      for(let k=0;k<lista.length;k++){
        const d=DESENHO(lista[k][0],lista[k][1]);
        const png=await svgParaPng(d.svg);
        if(k)doc.addPage();
        doc.addImage(png,'PNG',10,6,190,285);
      }
      await entregar(nome,doc.output('blob'));
    }else{
      const d=DESENHO(lista[0][0],lista[0][1]);
      await entregar(nome.replace('.pdf','.svg'),svgCompleto(d.svg));
    }
  }catch(e){
    avisoBaixa('Não consegui preparar o arquivo agora. Tente de novo em instantes.');
  }
  if(bt){bt.disabled=false;bt.innerHTML=txt;}
}
async function entregar(nome,dados){
  let cap=null;
  try{cap=window.claude&&claude.use?await claude.use('downloads'):null;}catch(e){cap=null;}
  if(cap){
    try{await cap.save({filename:nome,data:dados});avisoBaixa('');return;}
    catch(err){
      const c=err&&err.code;
      if(c==='declined')return;
      if(c==='rate_limited'){avisoBaixa('Já tem um download aguardando resposta. Confirme e tente de novo.');return;}
      avisoBaixa('Este aparelho não deixou salvar o arquivo. O caderno completo também vem em PDF na conversa.');
      return;
    }
  }
  const url=URL.createObjectURL(typeof dados==='string'?new Blob([dados],{type:'image/svg+xml'}):dados);
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},2000);
}

/* ---------- confete ---------- */
function confete(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confete';document.body.appendChild(cv);
  const cx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cores=['#FF8A2B','#12A06E','#1B93C8','#F0455F','#7B5BE0','#FFC53D'];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.5,y:H*.4,
    vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*7,
    a:Math.random()*6.3,va:(Math.random()-.5)*.3,c:cores[Math.floor(Math.random()*cores.length)]}));
  let t=0;
  (function loop(){
    t++;cx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
      cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
    if(t<155)requestAnimationFrame(loop);else cv.remove();
  })();
}

<script>
/* Registra o modo offline e, quando existir uma versao mais nova no servidor,
   troca sozinho e recarrega uma vez so. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.update();
      setInterval(function(){reg.update();},60*60*1000);
      reg.addEventListener('updatefound',function(){
        var novo=reg.installing;
        if(!novo)return;
        novo.addEventListener('statechange',function(){
          if(novo.state==='installed'&&navigator.serviceWorker.controller){
            novo.postMessage('atualizar-agora');
          }
        });
      });
    }).catch(function(){});
    /* Na PRIMEIRA visita o service worker assume o controle e isso tambem
       dispara controllerchange — recarregar ali seria um piscar sem motivo.
       So recarregamos quando ja havia um controlador, ou seja, numa troca
       de versao de verdade. */
    var tinhaControlador=!!navigator.serviceWorker.controller;
    var recarregou=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!tinhaControlador||recarregou)return;
      recarregou=true;location.reload();
    });
  });
}
</script>
