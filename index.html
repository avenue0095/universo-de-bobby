<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <div class="sig" id="logo"></div>
      <div><b id="nome-materia">Matemática</b><span>O universo de Bobby</span></div>
    </div>
    <div class="stat fogo" id="st-fogo" title="Dias seguidos jogando"></div>
    <div class="stat moedas" id="st-moedas" title="Moedas"></div>
    <button class="icobtn" id="troca-materia" aria-label="Trocar de matéria" title="Trocar de galáxia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3.4"/><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(-30 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.6" transform="rotate(30 12 12)"/></svg></button>
    <button class="icobtn" id="musica" aria-label="Música: desligada" aria-pressed="false"></button>
    <button class="icobtn" id="som" aria-label="Voz e som"></button>
  </div>
</header>

<section class="perfis" id="perfis"></section>
<section class="perfis" id="materias"></section>
<section class="galeria-tela" id="perfil"></section>

<main class="tela" id="tela"></main>

<nav class="barra-baixo" id="barra" aria-label="Navegação principal">
  <button id="bb-mapa" aria-label="Mapa"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3L12 3Z"/></svg><span>Mapa</span></button>
  <button id="bb-pers" aria-label="Meu personagem"><span class="retrato-bb" id="retrato-bb"></span><span>Personagem</span></button>
  <button id="bb-gal" aria-label="Meus desenhos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m5.5 17 4-5 3 3.5L16 10.5l2.6 6.5"/></svg><span>Desenhos</span><i class="ponto" id="ponto-gal" hidden></i></button>
  <button id="bb-perfil" aria-label="Perfil"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.6-9 5.6V22h18v-2.4c0-3-4-5.6-9-5.6Z"/></svg><span>Perfil</span></button>
</nav>

<section class="licao" id="licao" aria-live="polite">
  <div class="lc-topo">
    <button class="icobtn" id="fechar" aria-label="Sair da fase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="barra"><i id="prog"></i></div>
    <button class="icobtn" id="rever" aria-label="Rever a aula" title="Rever a aula"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2ZM9 19h6v1.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5V19Z"/></svg></button>
    <div class="vidas" id="vidas" title="Corações desta fase"></div>
  </div>
  <div class="lc-corpo"><div class="lc-in" id="palco"></div></div>
  <div class="pe" id="pe">
    <div class="pe-in">
      <button id="dica" aria-label="Pedir uma dica" title="Pedir uma dica"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2ZM9 19h6v1.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20.5V19Z"/></svg></button>
      <div class="msg"><span class="selo" id="selo"></span><div><b id="fb-t"></b><small id="fb-s"></small></div></div>
      <button class="btn" id="acao">Verificar</button>
    </div>
  </div>

  <div class="revisao" id="revisao">
    <div class="rev-topo">
      <button class="icobtn" id="fechar-rev" aria-label="Voltar aos exercícios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
      <h2 id="rev-titulo">Aula</h2>
    </div>
    <div class="rev-corpo" id="rev-corpo"></div>
  </div>
</section>

<section class="galeria-tela" id="galeria" aria-label="Meus desenhos">
  <div class="rev-topo">
    <button class="icobtn" id="fechar-gal" aria-label="Fechar a galeria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <h2>Meus desenhos</h2>
  </div>
  <div class="rev-corpo" id="gal-corpo"></div>
</section>
<section class="galeria-tela desenho-tela" id="desenho-tela" aria-label="Desenho para colorir"></section>
<div id="impressao" aria-hidden="true"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="tt-nome">
  <div class="cx">
    <div class="mascote-cx" id="masc-modal"></div>
    <h2 id="tt-nome">Novo jogador</h2>
    <p id="txt-nome">Escolha um nome e a cor do seu Bobby.</p>
    <input id="campo-nome" maxlength="18" placeholder="Seu nome" autocomplete="off">
    <div class="cores" id="cores"></div>
    <div class="niveis" id="niveis"></div>
    <div class="linha">
      <button class="btn fantasma" id="pular-nome">Cancelar</button>
      <button class="btn" id="salvar-nome">Pronto!</button>
    </div>
  </div>

function blocos(prompt,alvo,o){return Object.assign({type:'blocos',prompt:prompt,answer:String(alvo)},o||{});}
function fracQ(prompt,a,b,o){return Object.assign({type:'fracao',prompt:prompt,answer:String(a),partes:b},o||{});}

function mc(prompt,correct,wrongs,o){
o=o||{};correct=String(correct);
const set=[correct];
(wrongs||[]).forEach(w=>{const s=String(w);if(!set.some(x=>x.trim()===s.trim())&&set.length<4)set.push(s);});

const cand=escreve(v);
if(cand!==correct&&set.indexOf(cand)<0)set.push(cand);
}
return Object.assign({type:'mc',prompt:prompt,options:shuf(set),answer:correct},o);
}

const marcaNegativo=mk=>()=>{const q=mk();if(q&&typeof q==='object')q.negativo=true;return q;};
function pool(minU,maxU){const ls=[];UNITS_MAT.forEach(u=>{if(u.n>=minU&&u.n<=maxU)u.lessons.forEach(l=>{if(l.id!=='10.5')ls.push.apply(ls,l.id==='10.4'?l.makers.map(marcaNegativo):l.makers);});});return ls;}
function hardMaker(){return pick(pool(6,10))();}
function anyMaker(){return pick(pool(1,10))();}
function genQuestions(lesson,n){
const out=[];const seen=new Set();
const emOrdem=!!lesson.ordem;
const novaSacola=()=>emOrdem?lesson.makers.slice():shuf(lesson.makers);
let bag=novaSacola();let i=0,guard=0;
if(!emOrdem){
for(let t=0;t<14;t++){
const j=t%bag.length;
let q0;try{q0=bag[j]();}catch(e){continue;}
if(q0&&q0.type==='mc'){q0.__mk=bag[j];out.push(q0);seen.add(q0.prompt+'|'+q0.answer);break;}

por:['A caixa de letras','O trem das sílabas','A feira das palavras','A oficina dos sons','O correio das frases',

'A loja de roupas','Lar doce lar','Um dia na cidade','Fazendo amigos','Falando como um local']
};
const COD_DESENHO={mat:'mat',pt:'por',en:'ing'};
function desenhoIdDe(matApp,n){return 'des-'+COD_DESENHO[matApp]+('0'+n).slice(-2);}
function desenhosCatalogo(){
const r=[];
['mat','pt','en'].forEach(m=>{

});
return r;
}

P('A estratégia','<ol class="passos"><li>Procure as <b>vogais</b>: A, A.</li><li>Toda sílaba precisa de uma; então a palavra tem umas 2 sílabas.</li><li>Teste juntar consoante + vogal: CA... SA...</li><li>CASA! Leia para conferir.</li></ol>'),
P('Comece pelo som que você conhece','Se ver as letras P, O, A, S, pense em sílabas conhecidas: PO, SA, PA, SO. Monte com elas e teste: SA-PO. Achou.'),

AULAS['p3.5']=[

P('Pares que confundem','<ol class="passos"><li>MALA e MALHA</li><li>BOLA e BOLO</li><li>PATO e PRATO</li><li>Leia cada par em voz alta e ache a letra diferente.</li></ol>'),
P('Devagar no comecinho e no fim','As diferenças costumam estar na primeira ou na última letra. Passe o dedo por baixo da palavra enquanto lê, sem pular nada.'),
P('Pra não esquecer','Boa leitura não é leitura rápida, é leitura certa. A velocidade vem sozinha depois.')
];
AULAS['p4.1']=[
P('O C tem dois sons','O C muda de som conforme a vogal que vem depois. Com A, O e U ele fica <b>duro</b>: CA, CO, CU (casa, copo, cuca). Com E e I ele fica <b>fino</b>: CE, CI (cebola, cinco).',DUO(['CA CO CU','som de K'],['CE CI','som de S'])),

P('Testando','<ol class="passos"><li>CASA: depois do C vem A → som duro, "kaza".</li><li>CEBOLA: depois do C vem E → som fino, "sebola".</li><li>CINCO tem os dois: CI (fino) e CO (duro).</li></ol>'),
P('Pra não esquecer','Olhe sempre a vogal seguinte antes de decidir o som do C. Ela é quem manda.')

AULAS['p4.2']=[

AULAS['p4.3']=[

P('Pra não esquecer','SS só existe entre vogais. Nunca no começo nem no fim da palavra.')

P('Aplicando','<ol class="passos"><li>Palavra: CA_PO (lugar de plantar).</li><li>A próxima letra é <b>P</b>.</li><li>Antes de P vai M → CAMPO.</li></ol>'),

P('O teste da pergunta','<ol class="passos"><li>Leia o que está escrito.</li><li>Pergunte: <b>eu entendi o que aconteceu?</b></li><li>Se sim, é frase. Se ficou faltando algo, não é.</li></ol>'),

AULAS['p5.4']=[

function banco(m,i){
const b=VOC[m];const ini=Math.min(b.length-6,i*2);
return b.slice(Math.max(0,ini),Math.max(6,ini+7)).map(x=>({en:x[0],pt:x[1]}));
}
var FALA_EN={},SIG_EN={};
function podeOuvirEN(){
try{return typeof audioPodeOuvir==='function'?audioPodeOuvir():true;}catch(e){return true;}
}
function ouvirEN(prompt,certa,erradas){
const fala=FALA_EN[String(certa).toLowerCase()];
const sig=SIG_EN[String(certa).toLowerCase()];
if(!podeOuvirEN()){
if(fala)return Object.assign({type:'mc',prompt:'Qual destas palavras se fala assim: <b>“'+fala+'”</b>?',
options:shuf([certa].concat(erradas)),answer:certa,
dica:'Leia cada opção em voz alta e veja qual soa como “'+fala+'”.'});
if(sig)return Object.assign({type:'mc',prompt:'Como se diz <b>'+sig+'</b> em inglês?',
options:shuf([certa].concat(erradas)),answer:certa});
}
return Object.assign({type:'mc',ouvir:certa,lang:'en-US',prompt:prompt,
options:shuf([certa].concat(erradas)),answer:certa,
dica:(fala?'Aperte o botão do som de novo. A palavra se fala <b>“'+fala+'”</b>.'
:'Aperte o botão do som de novo e escute com atenção.')});
}
function vocMakers(m,i){
const B=banco(m,i);

()=>{const w=pick(B);return ouvirEN('Ouça e escolha a palavra.',w.en,outras(w.en).map(x=>x.en));},
()=>{const w=pick(B.filter(x=>x.en.length<9&&x.en.indexOf(' ')<0));
return w?txtQ('Escreva em inglês: <b>'+w.pt+'</b>',w.en,{teclado:'letra'}):
mc('Como se diz '+B[0].pt+'?',B[0].en,outras(B[0].en).map(x=>x.en));},

];
}

const _norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim();
function _colide(a,b){
const x=_norm(a),y=_norm(b);
if(!x||!y)return true;
if(x===y)return true;
const px=x.split(/ +/),py=y.split(/ +/);
return px.some(p=>p.length>1&&py.indexOf(p)>=0);
}
function _outrasEN(id,alvo,campo){

const certa=campo==='en'?alvo.en:alvo.pt;
const par=campo==='en'?alvo.pt:alvo.en;

const doMundo=(VOC[m]||[]).map(x=>({en:x[0],pt:x[1]}));
const vistos={};const res=[];
shuf(daFase).concat(shuf(doMundo)).forEach(w=>{
if(res.length>=3)return;
const v=campo==='en'?w.en:w.pt;
const outroLado=campo==='en'?w.pt:w.en;
if(_colide(v,certa))return;
if(_colide(outroLado,par))return;
if(res.some(r=>_colide(r,v)))return;
if(vistos[v])return;
vistos[v]=1;res.push(v);
});
return res;
}

const cima=(topo?Math.max(0,topo.getBoundingClientRect().bottom):0)+8;

const PE_DO_PERSONAGEM=40;
function grupoDoNo(no){
if(!no)return [];
const rot=no.querySelector('.rot');
return [no,rot&&getComputedStyle(rot).display!=='none'?rot:null].filter(Boolean);
}
function alvoDoGrupo(els){
const rs=els.filter(Boolean).map(e=>e.getBoundingClientRect()).filter(r=>r.height>0);
const max=Math.max(0,document.documentElement.scrollHeight-innerHeight);
if(!rs.length)return window.scrollY;
const t=Math.min(...rs.map(r=>r.top)),b=Math.max(...rs.map(r=>r.bottom))+PE_DO_PERSONAGEM,f=faixaVisivel();
const desloca=(b-t)<=(f.baixo-f.cima)?(t+b)/2-(f.cima+f.baixo)/2:t-f.cima;
return Math.max(0,Math.min(max,window.scrollY+desloca));
}
function cameraPara(el,frac,ms,fim){

const reduz=(typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches)||typeof requestAnimationFrame!=='function'||typeof cancelAnimationFrame!=='function';
const alvoDe=Array.isArray(el)?()=>alvoDoGrupo(el):()=>{const r=el.getBoundingClientRect();return Math.max(0,Math.min(document.documentElement.scrollHeight-innerHeight,window.scrollY+r.top+r.height/2-innerHeight*(frac||.66)));};

cancelAnimationFrame(CAM.raf);
const t0=performance.now();
const passo=now=>{
const t=Math.min(1,(now-t0)/ms),y=window.scrollY,alvo=alvoDe();
window.scrollTo(0,y+(alvo-y)*Math.min(1,.18+t*.5));
if(t<1)CAM.raf=requestAnimationFrame(passo);else{window.scrollTo(0,alvoDe());if(fim)fim();}
};
CAM.raf=requestAnimationFrame(passo);
}

const ARTE_CACHE='bobby-arte-v1';
const arteLista=()=>Object.keys(typeof ATIVOS==='object'?ATIVOS:{}).map(k=>ARTE_BASE+ATIVOS[k][0]);
async function arteContarGuardadas(){
try{
if(typeof caches==='undefined')return 0;
const c=await caches.open(ARTE_CACHE),lista=arteLista();let n=0;
for(const u of lista){if(await c.match(u))n++;}
return n;
}catch(e){return 0;}

async function arteGuardarTudo(progresso){
const lista=arteLista();
if(typeof caches==='undefined'||typeof fetch!=='function')return {ok:false,falhas:0,total:lista.length,semCache:true};
const cache=await caches.open(ARTE_CACHE);
let i=0,feitos=0,falhas=0;
const trabalha=async()=>{
while(i<lista.length){
const u=lista[i++];
try{
if(!(await cache.match(u))){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);await cache.put(u,r);}
}catch(e){falhas++;}
feitos++;
if(progresso)try{progresso(feitos,lista.length);}catch(e){}
}
};
await Promise.all([trabalha(),trabalha(),trabalha(),trabalha()]);
return {ok:falhas===0,falhas:falhas,total:lista.length};
}

const PBKDF2_VOLTAS=150000,PIN_ERROS_ATE_ESPERA=5;
function temSenha(){return !!(STORE.senha&&STORE.senha.h);}
const paraHex=b=>Array.from(new Uint8Array(b)).map(x=>('0'+x.toString(16)).slice(-2)).join('');
const temCripto=()=>typeof crypto!=='undefined'&&crypto&&crypto.subtle&&typeof crypto.getRandomValues==='function';
function salAleatorio(){const a=new Uint8Array(16);crypto.getRandomValues(a);return paraHex(a);}
async function pbkdf2(pin,salHex,voltas){
const chave=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pin)),'PBKDF2',false,['deriveBits']);
const sal=Uint8Array.from(salHex.match(/../g).map(x=>parseInt(x,16)));
return paraHex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:sal,iterations:voltas,hash:'SHA-256'},chave,256));
}
function hashLegado(pin,sal){
let h=5381;const t=sal+'|'+String(pin);
for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;
for(let v=0;v<5000;v++)h=((h<<5)+h+(v%97))>>>0;
return h.toString(36);
}
async function definirSenha(pin){
if(temCripto()){
const s=salAleatorio();
STORE.senha={v:2,s:s,it:PBKDF2_VOLTAS,h:await pbkdf2(pin,s,PBKDF2_VOLTAS),e:0,b:0};
}else{
const s='s'+Math.random().toString(36).slice(2,10);
STORE.senha={s:s,h:hashLegado(pin,s)};
}
salvarStore();
}
const esperaDoPin=()=>Math.max(0,((STORE.senha&&STORE.senha.b)||0)-Date.now());
async function conferirSenha(pin){
if(!temSenha())return true;
if(esperaDoPin()>0)return false;
const sn=STORE.senha;
let ok=false;
if(sn.v===2&&temCripto())ok=(await pbkdf2(pin,sn.s,sn.it||PBKDF2_VOLTAS))===sn.h;
else if(sn.v!==2){ok=hashLegado(pin,sn.s)===sn.h;if(ok)await definirSenha(pin);}
if(ok){if(STORE.senha.e||STORE.senha.b){STORE.senha.e=0;STORE.senha.b=0;salvarStore();}return true;}
if(sn.v===2){
sn.e=(sn.e||0)+1;
if(sn.e>=PIN_ERROS_ATE_ESPERA)sn.b=Date.now()+Math.min(900,30*Math.pow(2,sn.e-PIN_ERROS_ATE_ESPERA))*1000;
salvarStore();
}
return false;
}

function ordenarVerbos(qs){

while(out.length<qs.length){
const n=out.length,u1=n>=1?verboDe(out[n-1]):'',u2=n>=2?verboDe(out[n-2]):'';
const cand=Object.keys(grupos).filter(v=>grupos[v].length).sort((x,y)=>grupos[y].length-grupos[x].length);
let v=cand.find(v=>!(v===u1&&v===u2));
if(!v)v=cand[0];
out.push(grupos[v].shift());
}
return out;
}

if(!q||typeof q!=='object'||q.figure||q.__item||q.__aquec||q.__irma)return null;

if(['mc','input','texto'].indexOf(q.type)<0)return null;
if(/<(?!\/?(b|br|strong|em)\b)[a-z]/i.test(String(q.prompt))||/[<&]/.test(String(q.answer))||/&(?!nbsp;)[a-z]+;/i.test(String(q.prompt)))return null;

let e=nucleoDoEnunciado(q.prompt);
if(!r||r.length>16||/^(verdadeiro|falso)$/i.test(r)||/[<>]/.test(r))return null;
if(e.length<2||e.length>72||/^(qual está certo|qual delas|qual destas)\??$/i.test(e))return null;
const conta=/^[\d\s+−×÷\-:,.()=_?]+$/.test(e)&&/\d/.test(e);
let ancora='';

const pedacos=(e.match(/["“][^"“”]{2,}["”]/g)||[]).concat(e.match(/(?:^|[^\p{L}])([A-ZÁÉÍÓÚÂÊÔÃÕÇ]{3,})(?=$|[^\p{L}])/gu)||[]);
ancora=pedacos.map(soLetras).join('|');
if(ancora&&!ancoraTem(ancora,soLetras(r)))ancora='';
}
return {e:e,r:r,kr:chaveVerbo(r),ke:chaveVerbo(e),q:q,unica:q.type!=='mc'||conta,ancora:ancora,ops:(q.options||[]).map(chaveVerbo)};
}
const soLetras=t=>chaveVerbo(t).replace(/[^a-z0-9]/g,'');
const ancoraTem=(ancora,x)=>!!x&&(ancora.indexOf(x)>=0||ancora.split('|').some(a=>a&&x.indexOf(a)===0));
function parCombina(p,o){
if(p.kr===o.kr||p.ke===o.ke)return false;

return p.ops.indexOf(o.kr)>=0;
}
function trincaDePares(pool){
for(let a=0;a<pool.length;a++)for(let b=a+1;b<pool.length;b++){
if(!parCombina(pool[a],pool[b])||!parCombina(pool[b],pool[a]))continue;
for(let c=b+1;c<pool.length;c++){
const t=[pool[a],pool[b],pool[c]];
if(t.every(x=>t.every(y=>x===y||parCombina(x,y))))return t;
}
}
return null;
}
function montarLigar(pares){

function comLigar(qs){
if(qs.some(q=>q&&q.verbo==='ligar'))return qs;
const simples=i=>i>0&&(!qs[i].verbo||qs[i].verbo==='tocar-ouvir')&&['mc','input','texto'].indexOf(qs[i].type)>=0;

}

const OBJ_TAM={max:48,min:36,gap:4,pad:8};
function encaixaObjetos(){
const cena=document.querySelector('#palco .cena-obj:not(.arrastar)'),pe=document.querySelector('#pe'),alts=document.querySelector('#palco .alts');
if(!cena||!pe||!alts)return;
const n=cena.querySelectorAll('.obj').length;if(!n)return;
const lc=document.querySelector('.lc-corpo'),rolado=lc?lc.scrollTop:0;
const cr=cena.getBoundingClientRect(),abaixo=alts.getBoundingClientRect().bottom-cr.bottom,topo=cr.top+rolado;
const largura=cena.clientWidth-2*OBJ_TAM.pad,altura=pe.getBoundingClientRect().top-8-topo-abaixo-2*OBJ_TAM.pad-4;
const cabe=s=>{const cols=Math.max(1,Math.floor((largura+OBJ_TAM.gap)/(s+OBJ_TAM.gap)));const lin=Math.ceil(n/cols);return lin*s+(lin-1)*OBJ_TAM.gap<=altura;};
let s=OBJ_TAM.max;while(s>OBJ_TAM.min&&!cabe(s))s-=2;
cena.style.setProperty('--obj',s+'px');
cena.style.setProperty('--jit',s>=OBJ_TAM.max?'1':'0');
cena.classList.toggle('apertada',s<OBJ_TAM.max);
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('resize',()=>{if(document.querySelector('#palco .cena-obj'))encaixaObjetos();});

const TINTA_LIMIAR=140;
function tintaSemente(lum,w,h,x,y){
x=Math.round(x);y=Math.round(y);
for(let r=0;r<=3;r++){
for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
const px=x+dx,py=y+dy;
if(px<0||py<0||px>=w||py>=h)continue;
if(lum[py*w+px]>=TINTA_LIMIAR)return py*w+px;
}
}
return -1;
}
function tintaRegiao(lum,w,h,x,y){
const s=tintaSemente(lum,w,h,x,y);
if(s<0)return [];
const vis=new Uint8Array(w*h),out=[],pilha=[s];
vis[s]=1;
while(pilha.length){
const i=pilha.pop();out.push(i);
const px=i%w,py=(i-px)/w;
if(px>0&&!vis[i-1]&&lum[i-1]>=TINTA_LIMIAR){vis[i-1]=1;pilha.push(i-1);}
if(px<w-1&&!vis[i+1]&&lum[i+1]>=TINTA_LIMIAR){vis[i+1]=1;pilha.push(i+1);}
if(py>0&&!vis[i-w]&&lum[i-w]>=TINTA_LIMIAR){vis[i-w]=1;pilha.push(i-w);}
if(py<h-1&&!vis[i+w]&&lum[i+w]>=TINTA_LIMIAR){vis[i+w]=1;pilha.push(i+w);}
}
return out;
}
function tintaMapa(lum,w,h,jogadas){
const mapa=new Uint8Array(w*h);
(jogadas||[]).forEach(j=>{
const reg=tintaRegiao(lum,w,h,j[0],j[1]),c=(j[2]|0)+1;
for(let k=0;k<reg.length;k++)mapa[reg[k]]=c;
});
return mapa;
}

function montarPacote(p){

function lerPacote(texto){
if(typeof texto!=='string'||texto.length>TETO_BACKUP_BYTES)return {ok:false,erro:'Esse arquivo é grande demais para ser um backup do Universo de Bobby.'};
let pac=null;
try{pac=JSON.parse(texto,semChavesPerigosas);}catch(e){}
if(!pac||pac.app!=='universo-de-bobby'||!pac.perfil||typeof pac.perfil!=='object')
return {ok:false,erro:'Esse arquivo não é um backup do Universo de Bobby.'};
const v=+pac.versao;
if(v!==3&&v!==4)return {ok:false,erro:v>4?'Esse backup vem de uma versão mais nova do app. Atualize o app e tente de novo.':'Não reconheci a versão desse backup.'};
const pf=pac.perfil;
const somaConfere=v===4?(String(pac.soma||'')===somaDoPerfil(pf)):true;
const nome=nomeSeguro(pf.nome||'Jogador',18)||'Jogador';
return {ok:true,versao:v,id:v===4&&pf.id?String(pf.id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40):'',nome:nome,
cor:CORES.indexOf(pf.cor)>=0?pf.cor:null,dados:estadoDe(pf.dados),somaConfere:somaConfere};
}
function aplicarPacote(lido,modo){
const idx=lido.id?STORE.perfis.findIndex(p=>p.id===lido.id):-1;
const cor=lido.cor||CORES[STORE.perfis.length%CORES.length];
if(modo==='substituir'&&idx>=0){
STORE.perfis[idx].nome=lido.nome;STORE.perfis[idx].cor=cor;STORE.perfis[idx].dados=lido.dados;
if(STORE.atual===idx){S=estadoDe(lido.dados);S.nome=lido.nome;}
salvarStore();return idx;
}
STORE.perfis.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),pid:sorteioId(12),
nome:lido.nome,cor:cor,criado:Date.now(),dados:lido.dados});
salvarStore();return STORE.perfis.length-1;
}

ordem.forEach(k=>{const on=voltaram.indexOf(k)>=0;e+='<g data-materia="'+MATCOD[k]+'"><circle class="estrela'+(on?' on':'')+'" cx="'+pos[k][0]+'" cy="'+pos[k][1]+'" r="'+(on?11:7)+'"/></g>';});

function planetaCompleto(){return UNITS.every(u=>mundoCompleto(u));}
function cerimoniaDoPlaneta(depois){
const chave='pl'+MATERIA;
if(cerJaVista(chave)||!planetaCompleto()){if(depois)depois();return false;}
cerMarca(chave);
const voltaram=['mat','pt','en'].filter(k=>cerJaVista('pl'+k)),todas=voltaram.length===3,pl=PLANETAS[MATERIA],est=ESTRELAS_DO_CEU[MATERIA];
const nome=S.nome||'explorador';
const fala1=todas?'A constelação acendeu. O céu inteiro agora tem o seu nome.':falaDe('estrela');
cerBase('<div class="cer-ceu">'+constelacaoSVG(voltaram,nome)+'</div>'+
'<div class="cer-atores p1">'+MASC('comemora')+imgArte(pl.guia+'-p02',{cls:'cer-guia',alt:''})+'</div>'+
'<h2 class="p2">Planeta '+pl.n+' completo!</h2>'+
'<p class="fala-p p2">A '+est.n+' voltou para o céu.</p>'+
'<p class="fala-p p3">'+(todas?'A constelação de '+escapa(nome)+' acendeu. O céu inteiro agora tem o seu nome.':escapa(fala1))+'</p>'+
'<p class="fala-p p4">'+escapa(falaDe('embaralho'))+'</p>'+
'<p class="fala-p p5">Descansar também faz parte da aventura.</p>'+
'<div class="folha-bts p5"><button class="btn-acao" id="cer-ok">Voltar ao mapa</button></div>');
$('#cer-ok').addEventListener('click',()=>{cerFecha();if(depois)depois();});
cerAgenda(()=>{sfx('planetaOk');},300);
cerAgenda(()=>{sfx('motivo','embaralho');},4000);
cerAgenda(()=>{if(S.voz!==false)falar(fala1);},2600);
cerAgenda(()=>{const f=$('#folha .cer');if(f)f.classList.add('tudo');},6000);
return true;
}
function cerimoniasDoFim(u){
cerimoniaDaEtapa(u,()=>{if(planetaCompleto())cerimoniaDoPlaneta();});
}
function confete(origem){
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const cv=document.createElement('canvas');cv.className='confete';document.body.appendChild(cv);
const cx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
const css=typeof getComputedStyle==='function'?getComputedStyle(document.body):null;
const cores=['--cor-acao','--mat-base','--ing-base','--cor-ainda','--por-base','--cor-ouro'].map(n=>(css&&css.getPropertyValue(n).trim())||'orange');
const ox=origem&&isFinite(origem.x)?origem.x:W/2,oy=origem&&isFinite(origem.y)?origem.y:H*.4,esp=origem?40:W*.5;
const ps=Array.from({length:origem?70:120},()=>({x:ox+(Math.random()-.5)*esp,y:oy,
vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:6+Math.random()*7,
a:Math.random()*6.3,va:(Math.random()-.5)*.3,c:cores[Math.floor(Math.random()*cores.length)]}));
let t=0;
(function loop(){
t++;cx.clearRect(0,0,W,H);
ps.forEach(p=>{p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();});
if(t<155)requestAnimationFrame(loop);else cv.remove();
})();
}
let corEscolhida=CORES[0],criando=false,faixaEscolhida='f78';
function pintarCores(){
$('#cores').innerHTML=CORES.map(c=>'<button class="cor'+(c===corEscolhida?' on':'')+
'" data-c="'+c+'" style="--cor-da-tinta:'+c+'" aria-label="Cor '+(CORES.indexOf(c)+1)+'" aria-pressed="'+(c===corEscolhida)+'"></button>').join('');
$('#cores').querySelectorAll('.cor').forEach(b=>b.addEventListener('click',()=>{
corEscolhida=b.dataset.c;pintarCores();
$('#masc-modal').style.setProperty('--aro',corEscolhida);
}));
}
function pedirNome(nova){
criando=!!nova;
corEscolhida=nova?CORES[STORE.perfis.length%CORES.length]:perfilAtual().cor;
$('#masc-modal').innerHTML=retratoBobby();
$('#masc-modal').style.setProperty('--aro',corEscolhida);
$('#tt-nome').textContent=nova?'Novo jogador':'Trocar o nome';
$('#txt-nome').textContent=nova?'Escolha um nome e uma cor para o seu retrato.':'Você pode mudar seu nome e sua cor.';
pintarCores();faixaEscolhida=nova?'f78':(S.faixa||'f78');pintarNiveis();
$('#modal').classList.add('on');
const c=$('#campo-nome');c.value=criando?'':(perfilAtual().nome||'');
setTimeout(()=>c.focus(),80);
}
function pintarNiveis(){
const ns=[['f78','7 a 8 anos','tudo lido em voz alta e menos opções'],
['f910','9 a 10 anos','ritmo normal'],
['f1112','11 a 12 anos','sem ajudas extras']];
$('#niveis').innerHTML=ns.map(n=>'<button class="nv'+(n[0]===faixaEscolhida?' on':'')+'" data-n="'+n[0]+'"><b>'+n[1]+'</b><span>'+n[2]+'</span></button>').join('');
$('#niveis').querySelectorAll('.nv').forEach(b=>b.addEventListener('click',()=>{faixaEscolhida=b.dataset.n;pintarNiveis();}));
}
function salvarNome(){
const n=($('#campo-nome').value.trim()||'Jogador '+(STORE.perfis.length+1)).slice(0,18);
$('#modal').classList.remove('on');
if(criando){novoPerfil(n,corEscolhida);return;}
STORE.perfis[STORE.atual].nome=n;
STORE.perfis[STORE.atual].cor=corEscolhida;
const mudouFaixa=S.faixa!==faixaEscolhida;
S.nome=n;S.faixa=faixaEscolhida;salvar();renderTrilha();
if(mudouFaixa)registrarEvento('config_mudou',{chave:'faixa'});
}
$('#acao').addEventListener('click',()=>{
calar();
if(LIC.etapa==='historia'){LIC.etapa='aula';LIC.passo=0;pintarLicao();return;}
if(LIC.etapa==='aula'){
const ps=passosDe(LIC.l);
if(LIC.passo<ps.length-1){LIC.passo++;somPasso();}
else LIC.etapa='questao';
pintarLicao();return;
}
if(LIC.etapa==='fim'){
if(LIC.vidas<=0){if(LIC.rev)abrirRevisaoMundo(LIC.ui);else abrirLicao(LIC.ui,LIC.li);}
else fecharLicao();
return;
}
if(!LIC.conferido)conferir();else avancar();
});
$('#fechar').addEventListener('click',fecharLicao);
$('#rever').addEventListener('click',abrirRevisao);
$('#dica').addEventListener('click',mostrarDica);
$('#fechar-rev').addEventListener('click',()=>{calar();$('#revisao').classList.remove('on');});
$('#som').addEventListener('click',()=>{fecharTelasDaBarra();lojaOrigem='perfil';telaVoz();});
$('#musica').addEventListener('click',()=>{musicaAlternar();});
$('#salvar-nome').addEventListener('click',salvarNome);
$('#pular-nome').addEventListener('click',()=>{$('#modal').classList.remove('on');if(criando&&STORE.atual<0)telaPerfis();});
$('#campo-nome').addEventListener('keydown',e=>{if(e.key==='Enter')salvarNome();});
$('#troca-materia').addEventListener('click',telaMaterias);
$('#fechar-gal').addEventListener('click',fecharGaleria);
document.addEventListener('keydown',e=>{
if(!$('#licao').classList.contains('on')||LIC.etapa!=='questao')return;
if($('#revisao').classList.contains('on'))return;
const q=LIC.qs[LIC.i];
if(!LIC.conferido){
if(q.type==='mc'&&/^[1-4]$/.test(e.key)){
const b=$('#palco').querySelector('.alt[data-v="'+(+e.key-1)+'"]');if(b)b.click();return;
}
if(q.type==='input'){
if(/^[0-9]$/.test(e.key)){digitar(e.key);return;}
if(e.key===','||e.key==='.'){digitar(',');return;}
if(e.key==='Backspace'){digitar('apagar');return;}
}
}
if(e.key==='Enter'&&!$('#acao').disabled)$('#acao').click();
});
lerStore();
CAP_ATUAL=MATERIAS.mat.caps();MISS_ATUAL=MATERIAS.mat.miss();
if(STORE.perfis.length===0){telaPerfis();setTimeout(()=>pedirNome(true),300);}
else if(STORE.perfis.length===1){usarPerfil(0);}
else{telaPerfis();if(STORE.atual>=0){S=estadoDe(STORE.perfis[STORE.atual].dados);S.nome=STORE.perfis[STORE.atual].nome;garantirDia();}
CAP_ATUAL=MATERIAS.mat.caps();MISS_ATUAL=MATERIAS.mat.miss();renderTrilha();}
iniciarCiclo();
audioIniciar();
</script>

<script>
if('serviceWorker' in navigator){
window.addEventListener('load',function(){
navigator.serviceWorker.register('./sw.js').then(function(reg){
reg.update().catch(function(){});
setInterval(function(){reg.update();},60*60*1000);
reg.addEventListener('updatefound',function(){
var novo=reg.installing;
if(!novo)return;
novo.addEventListener('statechange',function(){
if(novo.state==='installed'&&navigator.serviceWorker.controller){
novo.postMessage('atualizar-agora');
}
});
});
}).catch(function(){});
var tinhaControlador=!!navigator.serviceWorker.controller;
var recarregou=false;
navigator.serviceWorker.addEventListener('controllerchange',function(){
if(!tinhaControlador||recarregou)return;
recarregou=true;location.reload();
});
});
}
</script>
